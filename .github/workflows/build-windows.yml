name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        shell: pwsh
        run: |
          $files = Get-ChildItem tests/*.test.mjs | Sort-Object Name
          foreach ($file in $files) {
            Write-Host "Running $($file.Name)"
            $output = & node --test $file.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              $text = ($output | Out-String).Trim()
              $escaped = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Failed $($file.Name)::$escaped"
              exit 1
            }
          }
      - name: Create import templates
        run: npm run templates
      - name: Build installer and portable EXE
        run: npm run build:win
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 项目人员调度台-Windows-x64
          path: |
            release/*.exe
            templates/*.xlsx
          if-no-files-found: error
          retention-days: 30
